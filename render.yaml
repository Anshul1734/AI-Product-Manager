# Render blueprint: FastAPI backend + static React frontend.
#
# Why Render rather than serverless for the API: a full pipeline run makes six
# LLM calls and, on Groq's free tier (8,000 tokens/minute per model), is paced
# into the 60-180 second range. Vercel/Netlify functions cap a request at 60s,
# which would kill a Standard or Deep run partway through. A long-running web
# service has no per-request ceiling, streams Server-Sent Events cleanly, and
# keeps the in-process plan memory warm between requests.
#
# Deploy: push this repo, then in Render choose New > Blueprint and point it here.
# Set GROQ_API_KEY on the API service, and REACT_APP_API_URL on the web service
# to the API's public URL.

services:
  - type: web
    name: aipm-api
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn asgi:app --host 0.0.0.0 --port $PORT
    # `/` always answers 200. /api/v1/health deliberately returns 503 when no
    # API key is configured, which is right for monitoring but would block a
    # first deploy before the key is set.
    healthCheckPath: /
    envVars:
      - key: GROQ_API_KEY
        sync: false # set in the Render dashboard; never commit a key
      - key: GROQ_MODEL
        value: openai/gpt-oss-120b
      - key: GROQ_FAST_MODEL
        value: openai/gpt-oss-20b
      - key: GROQ_ALT_MODEL
        value: qwen/qwen3.8-27b
      - key: GROQ_TPM_LIMIT
        value: "8000" # raise on a paid Groq tier to remove pacing
      # Enables the dense half of hybrid retrieval (BM25 alone needs no key).
      # The committed index already carries Jina-embedded vectors for the
      # corpus; this key is what lets a live query get embedded the same way
      # at request time, which dense search also requires. Without it, EMBEDDING_PROVIDER
      # auto-resolves to none and retrieval quietly runs BM25-only.
      - key: JINA_API_KEY
        sync: false # set in the Render dashboard; never commit a key
      - key: LOG_FORMAT
        value: json
      - key: LOG_LEVEL
        value: INFO
      - key: MEMORY_ENABLED
        value: "true"
      # Set to the frontend's public origin once it is deployed.
      - key: CORS_ORIGINS
        sync: false
      - key: PYTHON_VERSION
        value: "3.11.9"

  # Confirmed against Render's blueprint spec: `type` is web / pserv / worker /
  # cron / keyvalue -- there is no top-level "static" type, which is what
  # produced "unknown type static" on an earlier attempt. Static sites are
  # `type: web` with the special-case `runtime: static`; `env` is a deprecated
  # alias for `runtime`, not a separate field. The one real defect was
  # `plan: free`: a static runtime has no compute tier to select, so any
  # `plan` value -- "free" included -- fails validation. Omit it entirely.
  - type: web
    name: aipm-web
    runtime: static
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: build
    envVars:
      - key: REACT_APP_API_URL
        sync: false # the aipm-api service URL, e.g. https://aipm-api.onrender.com
    routes:
      # Single-page app: unknown paths resolve to the shell, not a 404.
      - type: rewrite
        source: /*
        destination: /index.html
